# Publica la demo en GitHub Pages, en cada push a main:
#   - el panel en modo demo (entra por Inicio), con el estudio de ejemplo y su reporte
#   - el prototipo de ejemplo con el recorder en modo local
# No necesita navegador: las sesiones de ejemplo ya vienen grabadas en packages/server/seed.
# Activar una vez en Settings → Pages → Source: GitHub Actions.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      # Repo de usuario/organización (taptana.github.io) → base "/". Repo de proyecto → "/<repo>/".
      - name: Build site
        run: |
          if [ "${{ github.event.repository.name }}" = "${{ github.repository_owner }}.github.io" ]; then
            export TAPTANA_BASE=/
          else
            export TAPTANA_BASE=/${{ github.event.repository.name }}/
          fi
          node scripts/build-site.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
